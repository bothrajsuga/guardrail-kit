name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=guardrail_kit --cov-report=term-missing --cov-fail-under=75
      - run: ruff check .
      - run: mypy

  adk-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        google-adk-version: ["2.0.0", "2.3.0", "2.6.0", "2.9.2", "2.10.0", "2.11.0", "2.12.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]' 'google-adk==${{ matrix.google-adk-version }}'
      - run: python -c "from guardrail_kit.integrations.google_adk import create_google_adk_plugin"
      - run: pytest tests/integration
        env:
          GUARDRAIL_KIT_REQUIRE_ADK: "1"

  adk-latest-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]' 'google-adk>=2.0.0'
      - run: pytest tests/integration
        env:
          GUARDRAIL_KIT_REQUIRE_ADK: "1"

  sqlglot-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlglot-version: ["sqlglot==30.0.0", "sqlglot>=30,<31"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install '${{ matrix.sqlglot-version }}'
      - run: pytest tests/unit tests/security

  mcp-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["mcp==2.3.0", "mcp>=2.3,<3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]' '${{ matrix.mcp-version }}'
      - run: pytest tests/integration/test_mcp_gateway.py tests/security/test_mcp_adversarial.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*

