name: Publish release

on:
  release:
    types: [published]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,google-adk]'
      - run: pytest --cov=guardrail_kit --cov-report=term-missing --cov-fail-under=75
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - run: twine check dist/*
      - name: Record distribution hashes
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - name: Upload verified distributions
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: Record workflow artifact digest
        run: echo "Artifact digest ${{ steps.upload.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: release-artifact/
      - name: Verify distribution hashes
        run: cd release-artifact && sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release-artifact/dist/

